<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Preview — korovan dev</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0 }
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        padding: 24px;
      }
      h1 { font-size: 1.1rem; margin-bottom: 20px; color: #aaa; letter-spacing: .05em }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }
      .card-canvas, .card-img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        background: #0d0d0d;
      }
      .card-img { object-fit: contain; padding: 16px; }
      .card-meta {
        padding: 10px 12px;
        font-size: .75rem;
        color: #888;
        border-top: 1px solid #2a2a2a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-name { font-weight: 600; color: #ccc; font-size: .8rem }
      .badge {
        font-size: .65rem;
        background: #222;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 2px 6px;
      }
      .badge-glb  { color: #4fc3f7 }
      .badge-png  { color: #a5d6a7 }
      .status {
        padding: 8px 12px;
        font-size: .7rem;
        color: #666;
        min-height: 28px;
      }
      .status.error { color: #ef9a9a }
      .status.ok    { color: #a5d6a7 }
    </style>
  </head>
  <body>
    <h1>korovan / dev / assets</h1>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/dev-assets.ts"></script>
  </body>
</html>
