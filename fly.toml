# fly.toml — korovan backend, Fly.io demo phase
# Platform rationale: docs/deploy-target.md (BOO-462)
#
# First-time setup (run once):
#   brew install flyctl
#   fly auth login
#   fly launch --name korovan --region ams --no-deploy
#   fly volumes create korovan_data --region ams --size 1
#   fly secrets set DB_PATH=/data/korovan.db
#   fly secrets set COOKIE_SIGNING_SECRET=$(openssl rand -hex 32)   # 64 hex = 32 bytes (BOO-498 gate)
#   # DEEPSEEK_API_KEY is NOT read at runtime yet (P1 ships scripted provider; wire in BOO-490/491).
#
# Deploy (stamp current commit SHA into the image):
#   fly deploy --build-arg GIT_SHA=$(git rev-parse --short HEAD)
#
# Smoke test:
#   curl https://korovan.fly.dev/healthz

app = "korovan"
primary_region = "ams"

[build]
  # Dockerfile must be at repo root (delivered by BOO-461).
  # Build context: repo root.
  # Build stages: pnpm install → pnpm --filter server build → node server/dist/index.js
  # Real SHA comes from --build-arg at deploy time; fly.toml cannot evaluate git commands.
  [build.args]
    GIT_SHA = "dev"

[env]
  NODE_ENV = "production"
  # Fly does NOT auto-inject PORT — the server reads process.env.PORT (default 8787),
  # so it must be set here to match http_service.internal_port below.
  PORT = "8080"
  # DB_PATH, COOKIE_SIGNING_SECRET → set via `fly secrets set` (never in fly.toml).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"
    unhealthy_threshold = 2

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "korovan_data"
  destination = "/data"
